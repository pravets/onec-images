name: Build bsl-sonar-scanner-cli Docker Image

on:
  push:
    tags:
      - 'bsl-sonar-scanner-cli_*'   # реагировать на теги, начинающиеся с bsl-sonar-scanner-cli_

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_REGISTRY_URL: ${{ secrets.DOCKER_REGISTRY_URL }}
      DOCKER_LOGIN: ${{ secrets.DOCKER_LOGIN }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      # Нужны для fallback-сборки базового onec-platform (build-onec-platform.sh)
      ONEC_USERNAME: ${{ secrets.ONEC_USERNAME }}
      ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, test and push bsl-sonar-scanner-cli image
        run: |
          export ONEC_VERSION="${GITHUB_REF#refs/tags/bsl-sonar-scanner-cli_}"
          echo "Собираем bsl-sonar-scanner-cli с onec-platform версии ${ONEC_VERSION}"
          ./src/build-bsl-sonar-scanner-cli.sh
