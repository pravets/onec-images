name: cs

# Стек 1С:Сервера взаимодействия (CS 30.x).
#
# Встроенные компоненты (поднимаются этим файлом): CS, Hazelcast, Elasticsearch.
# Опциональные встроенные: сайт внешних пользователей и web-chat (профиль site),
# объектное хранилище RustFS (профиль s3).
#
# Всегда внешние (в compose их нет, адреса задаются в .env):
#   PostgreSQL 15, медиасервер Janus, TURN/STUN (coturn).
#
# Любой «встроенный» компонент можно заменить внешним, не меняя образы:
# hazelcast/elasticsearch — переменными CS_HAZELCAST_* и CS_ES_*, S3 — CS_S3_*.
#
# Запуск:
#   cp .env.example .env      # и заполнить
#   docker compose up -d
#   docker compose --profile site --profile s3 up -d

x-cs-defaults: &cs-defaults
  restart: on-failure
  networks:
    - cs

services:
  # -------------------------------------------------------------------------
  # Hazelcast — кластерная координация CS
  # -------------------------------------------------------------------------
  hazelcast:
    <<: *cs-defaults
    image: ${CS_IMAGE_REGISTRY:-}cs-hazelcast:${CS_VERSION:-30.0.42}
    container_name: cs-hazelcast
    environment:
      CS_HAZELCAST_GROUP_NAME: ${CS_HAZELCAST_GROUP_NAME:-1ce-cs}
      CS_HAZELCAST_GROUP_PASSWORD: ${CS_HAZELCAST_GROUP_PASSWORD:-cs-pass}
    volumes:
      - hazelcast-data:/var/cs
    expose:
      - "5701"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5701"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # -------------------------------------------------------------------------
  # Elasticsearch — полнотекстовый поиск CS
  # -------------------------------------------------------------------------
  elasticsearch:
    <<: *cs-defaults
    image: ${CS_IMAGE_REGISTRY:-}cs-elasticsearch:${CS_VERSION:-30.0.42}
    container_name: cs-elasticsearch
    environment:
      CS_ES_CLUSTER_NAME: ${CS_ES_CLUSTER_NAME:-1ce-cs}
      CS_ES_NODE_NAME: ${CS_ES_NODE_NAME:-node-1}
      CS_ES_HEAP: ${CS_ES_HEAP:-1g}
    # Elasticsearch 5.6 требует vm.max_map_count >= 262144 на ХОСТЕ.
    # Через sysctls это задавать нельзя: часть демонов (в т.ч. Docker Desktop)
    # запрещает менять vm.* из контейнера, и тогда `docker compose up` падает.
    # На Linux-хосте выполните: sudo sysctl -w vm.max_map_count=262144
    volumes:
      - elasticsearch-data:/var/cs
    expose:
      - "9200"
      - "9300"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "5", "http://127.0.0.1:9200/"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  # -------------------------------------------------------------------------
  # Сервер взаимодействия
  # -------------------------------------------------------------------------
  server:
    <<: *cs-defaults
    image: ${CS_IMAGE_REGISTRY:-}cs-server:${CS_VERSION:-30.0.42}
    container_name: cs-server
    depends_on:
      hazelcast:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      # PostgreSQL всегда внешняя
      CS_DB_URL: ${CS_DB_URL:?задайте CS_DB_URL в .env}
      CS_DB_USER: ${CS_DB_USER:?задайте CS_DB_USER в .env}
      CS_DB_PASSWORD: ${CS_DB_PASSWORD:?задайте CS_DB_PASSWORD в .env}
      # Административный REST
      CS_ADMIN_USER: ${CS_ADMIN_USER:-admin}
      CS_ADMIN_PASSWORD: ${CS_ADMIN_PASSWORD:?задайте CS_ADMIN_PASSWORD в .env}
      CS_ADMIN_PORT: ${CS_ADMIN_PORT:-8087}
      # WebSocket для клиентов 1С
      CS_WS_PORT: ${CS_WS_PORT:-8086}
      CS_WS_WSS: ${CS_WS_WSS:-false}
      # Внутренние адреса стека (замените на внешние, чтобы вынести компонент)
      CS_HAZELCAST_ADDRESSES: ${CS_HAZELCAST_ADDRESSES:-hazelcast}
      CS_HAZELCAST_GROUP_NAME: ${CS_HAZELCAST_GROUP_NAME:-1ce-cs}
      CS_HAZELCAST_GROUP_PASSWORD: ${CS_HAZELCAST_GROUP_PASSWORD:-cs-pass}
      CS_ES_ADDRESSES: ${CS_ES_ADDRESSES:-elasticsearch:9300}
      CS_ES_CLUSTER_NAME: ${CS_ES_CLUSTER_NAME:-1ce-cs}
      # Публичные адреса
      CS_PUBLIC_URL: ${CS_PUBLIC_URL:-}
      CS_INTEGRATION_PUBLIC_URL: ${CS_INTEGRATION_PUBLIC_URL:-}
      # Видеосвязь: подключение внешнего Janus (пусто — видеосвязь выключена)
      CS_VIDEO_ENABLED: ${CS_VIDEO_ENABLED:-false}
      CS_MEDIA_SERVER_URL: ${CS_MEDIA_SERVER_URL:-}
      CS_MEDIA_SERVER_NAME: ${CS_MEDIA_SERVER_NAME:-Janus 1}
      CS_MEDIA_CONFEREE_LIMIT: ${CS_MEDIA_CONFEREE_LIMIT:-1000}
      # TURN/STUN
      CS_TURN_URL: ${CS_TURN_URL:-}
      CS_TURN_USER: ${CS_TURN_USER:-}
      CS_TURN_PASSWORD: ${CS_TURN_PASSWORD:-}
      # S3: пусто — хранилище не регистрируется (например, если S3 настроен вручную)
      CS_S3_ENDPOINT: ${CS_S3_ENDPOINT:-}
      CS_S3_BUCKET: ${CS_S3_BUCKET:-cs-bucket}
      CS_S3_ACCESS_KEY: ${CS_S3_ACCESS_KEY:-}
      CS_S3_SECRET_KEY: ${CS_S3_SECRET_KEY:-}
      CS_S3_REGION: ${CS_S3_REGION:-eu-west-1}
      CS_S3_SIGNATURE_VERSION: ${CS_S3_SIGNATURE_VERSION:-V2}
      CS_LOG_LEVEL: ${CS_LOG_LEVEL:-WARN}
      CS_LOG_CONSOLE: ${CS_LOG_CONSOLE:-true}
    volumes:
      - server-data:/var/cs
    ports:
      - "${CS_WS_HOST_PORT:-8086}:8086"
      - "${CS_ADMIN_HOST_PORT:-8087}:8087"
      - "${CS_INTEGRATION_HOST_PORT:-8443}:8443"
      - "${CS_CONFERENCE_HOST_PORT:-8444}:8444"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "5", "http://127.0.0.1:8087/rs/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  # -------------------------------------------------------------------------
  # Разовая регистрация зависимостей в CS (БД, S3, Janus, TURN).
  # Точка входа переопределена, чтобы не выполнять подготовку экземпляра.
  # -------------------------------------------------------------------------
  init:
    <<: *cs-defaults
    image: ${CS_IMAGE_REGISTRY:-}cs-server:${CS_VERSION:-30.0.42}
    container_name: cs-init
    restart: "no"
    entrypoint: ["/usr/local/bin/bootstrap-cs.sh"]
    depends_on:
      server:
        condition: service_healthy
    environment:
      # init — отдельный контейнер, поэтому админ-REST доступен только по имени сервиса
      CS_ADMIN_HOST: server
      CS_ADMIN_USER: ${CS_ADMIN_USER:-admin}
      CS_ADMIN_PASSWORD: ${CS_ADMIN_PASSWORD:?задайте CS_ADMIN_PASSWORD в .env}
      CS_ADMIN_PORT: ${CS_ADMIN_PORT:-8087}
      CS_DB_URL: ${CS_DB_URL:?задайте CS_DB_URL в .env}
      CS_DB_USER: ${CS_DB_USER:?задайте CS_DB_USER в .env}
      CS_DB_PASSWORD: ${CS_DB_PASSWORD:?задайте CS_DB_PASSWORD в .env}
      CS_BOOTSTRAP: ${CS_BOOTSTRAP:-once}
      CS_BOOTSTRAP_STRICT: ${CS_BOOTSTRAP_STRICT:-false}
      CS_MEDIA_SERVER_URL: ${CS_MEDIA_SERVER_URL:-}
      CS_MEDIA_SERVER_NAME: ${CS_MEDIA_SERVER_NAME:-Janus 1}
      CS_MEDIA_CONFEREE_LIMIT: ${CS_MEDIA_CONFEREE_LIMIT:-1000}
      CS_TURN_URL: ${CS_TURN_URL:-}
      CS_TURN_USER: ${CS_TURN_USER:-}
      CS_TURN_PASSWORD: ${CS_TURN_PASSWORD:-}
      CS_S3_ENDPOINT: ${CS_S3_ENDPOINT:-}
      CS_S3_BUCKET: ${CS_S3_BUCKET:-cs-bucket}
      CS_S3_ACCESS_KEY: ${CS_S3_ACCESS_KEY:-}
      CS_S3_SECRET_KEY: ${CS_S3_SECRET_KEY:-}
      CS_S3_REGION: ${CS_S3_REGION:-eu-west-1}
      CS_S3_SIGNATURE_VERSION: ${CS_S3_SIGNATURE_VERSION:-V2}
    volumes:
      - server-data:/var/cs

  # -------------------------------------------------------------------------
  # Сайт внешних пользователей (профиль site)
  # -------------------------------------------------------------------------
  site:
    <<: *cs-defaults
    profiles: ["site"]
    image: ${CS_IMAGE_REGISTRY:-}cs-site:${CS_VERSION:-30.0.42}
    container_name: cs-site
    environment:
      CS_PUBLIC_WS_URL: ${CS_PUBLIC_WS_URL:-wss://cs.example.com}
      CS_VAPID_PUBLIC_KEY: ${CS_VAPID_PUBLIC_KEY:-}
    ports:
      - "${CS_SITE_HOST_PORT:-8081}:80"

  # -------------------------------------------------------------------------
  # Web-chat (профиль site)
  # -------------------------------------------------------------------------
  web-chat:
    <<: *cs-defaults
    profiles: ["site"]
    image: ${CS_IMAGE_REGISTRY:-}cs-web-chat:${CS_VERSION:-30.0.42}
    container_name: cs-web-chat
    environment:
      CS_PUBLIC_WS_URL: ${CS_PUBLIC_WS_URL:-wss://cs.example.com}
      CS_VAPID_PUBLIC_KEY: ${CS_VAPID_PUBLIC_KEY:-}
    ports:
      - "${CS_WEB_CHAT_HOST_PORT:-8082}:80"

  # -------------------------------------------------------------------------
  # RustFS — встроенное S3-хранилище (профиль s3).
  # Для внешнего S3 этот сервис не нужен: задайте CS_S3_ENDPOINT и ключи.
  # Бакет создаётся один раз в консоли RustFS (http://<хост>:9001) или любым
  # S3-клиентом — так же, как это описано в руководстве 1С для MinIO.
  # -------------------------------------------------------------------------
  rustfs:
    <<: *cs-defaults
    profiles: ["s3"]
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    container_name: cs-rustfs
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${CS_S3_ACCESS_KEY:-rustfs}
      RUSTFS_SECRET_KEY: ${CS_S3_SECRET_KEY:-rustfs12345}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: ${RUSTFS_LOG_LEVEL:-error}
      # Каталог логов не переопределяем: контейнер работает от uid 10001 и
      # использует свой каталог /logs. Своё значение задавайте только на
      # записываемый том (например /data/logs).
      RUSTFS_OBS_LOG_DIRECTORY: ${RUSTFS_LOG_DIRECTORY:-/logs}
    volumes:
      - rustfs-data:/data
    ports:
      - "${RUSTFS_API_HOST_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_HOST_PORT:-9001}:9001"

networks:
  cs:
    driver: bridge

volumes:
  server-data:
  hazelcast-data:
  elasticsearch-data:
  rustfs-data:
