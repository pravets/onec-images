# nginx для статических SPA сайта внешних пользователей и web-chat.
# Один и тот же конфиг используется образами cs-site и cs-web-chat.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Клиент системы взаимодействия — одностраничное приложение:
    # неизвестные пути отдаются в index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # config.json формируется при старте контейнера и не должен кэшироваться.
    location = /config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
